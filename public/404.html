<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página não encontrada (404) | Dra. Carolina Zampronha</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/png" href="/planta.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #FAF7F4;
        color: #2E2225;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: #ffffff;
        border: 1px solid rgba(223, 200, 194, 0.7);
        border-radius: 28px;
        max-width: 540px;
        width: 100%;
        padding: 48px 32px;
        box-shadow: 0 10px 30px rgba(103, 67, 75, 0.06);
      }
      .tag {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: #B87986;
        margin-bottom: 16px;
        display: inline-block;
      }
      h1 {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 42px;
        font-weight: 400;
        line-height: 1.15;
        color: #221619;
        margin-bottom: 16px;
      }
      p {
        font-size: 15px;
        line-height: 1.6;
        color: #524146;
        margin-bottom: 32px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background-color: #B87986;
        color: #ffffff;
        font-weight: 500;
        font-size: 14px;
        padding: 14px 28px;
        border-radius: 9999px;
        text-decoration: none;
        transition: all 0.2s ease;
      }
      .btn:hover {
        background-color: #A36773;
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="tag">ERRO 404</span>
      <h1>Página não encontrada</h1>
      <p>O link que você tentou acessar não existe ou foi alterado. Convidamos você a retornar à página inicial e conhecer o atendimento médico em saúde mental da Dra. Carolina Zampronha.</p>
      <a href="/" class="btn">Retornar à página inicial</a>
    </div>
  </body>
</html>
